<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I have a question...</title>
<style>
body {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
background-color: #ffe6e6; /* Soft pink background */
font-family: 'Arial', sans-serif;
text-align: center;
overflow: hidden; /* Prevents scrolling when the button gets huge */
}
img {
max-width: 250px;
border-radius: 20px;
}
h1 {
color: #ff4d4d;
font-size: 2.5rem;
margin: 20px 0;
padding: 0 20px;
}
.buttons {
display: flex;
gap: 15px;
align-items: center;
justify-content: center;
margin-top: 20px;
flex-wrap: wrap;
}
button {
padding: 1em 2em;
font-size: 1.2rem;
font-weight: bold;
border: none;
border-radius: 10px;
cursor: pointer;
transition: all 0.3s ease; /* Smooth growing animation */
}
#yesBtn {
background-color: #4CAF50;
color: white;
box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
}
#noBtn {
background-color: #ff4d4d;
color: white;
box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
}
</style>
</head>
<body>

<!-- Cute Bear GIF -->
<img id="gif" src="https://media.tenor.com/EF-O6msoZ6YAAAAi/tkthao219-bubududu.gif" alt="Cute Bear">
<h1 id="question">Will you go out with me? Sanskruti 🥺</h1>

<div class="buttons">
<button id="yesBtn" onclick="sayYes()">Yes</button>
<button id="noBtn" onclick="sayNo()">No</button>
</div>

<script>
let noClickCount = 0;
let yesFontSize = 1.2; 

// The funny texts the No button will cycle through
const noTexts = [
"No", 
"Are you sure?", 
"Really sure??", 
"Think again!", 
"Last chance!", 
"Don't do this to me 😭", 
"You're breaking my heart!", 
"Okay, I see how it is...", 
"Just kidding, you have no choice!"
];

function sayNo() {
noClickCount++;

// If she taps No enough times, force a Yes
if (noClickCount >= noTexts.length) {
sayYes();
return;
}

// Change the No button text
const noBtn = document.getElementById('noBtn');
noBtn.innerText = noTexts[noClickCount];

// Dramatically increase the Yes button size
yesFontSize += 0.6; 
const yesBtn = document.getElementById('yesBtn');
yesBtn.style.fontSize = `${yesFontSize}rem`;
}

function sayYes() {
// Change the text and GIF on success
document.getElementById('question').innerText = "Yay! I knew you'd say Yes! ❤️";
document.getElementById('gif').src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif";

// Hide the buttons
document.querySelector('.buttons').style.display = 'none';
}
</script>
</body>
</html>
